# Render garde le plan gratuit endormi après ~15 min sans requête entrante. Endormi,
# l'application ne lit plus pnr-resa.corsica et aucune alerte ne part. Ce ping réveille
# l'API avant qu'elle ne s'arrête, et la première page d'un lien partagé reste rapide.
#
# À supprimer si l'API passe sur un plan payant qui ne s'endort pas.
name: Garder l'API éveillée

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/health
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 \
            https://refugealert.onrender.com/api/health)
          echo "health -> $code"
          test "$code" = "200"
